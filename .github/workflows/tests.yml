name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 only, matching `.python-version` and the miner guide's requirement: 3.12 sums floats
        # with error compensation and the accounting tests assert exact sums (measured 2026-09-08:
        # the same arm summed to 1.4 on 3.12 and 1.4000000000000001 on 3.11).
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install --no-cache-dir uv

      # dev = pytest + math_verify (required by the unconditional MATH grader tests); tee =
      # cryptography + dcap-qvl (unlocks full DCAP quote-verification coverage). Dataset clients stay
      # in the optional eval extra so this offline suite never depends on a live dataset download.
      #
      # `llm` (httpx + openai + certifi) is here for ONE test that must not be allowed to skip:
      # `test_pool_client_ignores_env_tls_and_proxy_overrides` is the inverted PoC for the hole where
      # a miner could point the pool client at its own CA/proxy and forge every response. Without the
      # client stack installed it does not skip quietly — it fails collection — and the obvious
      # "fix" of making it skippable would retire the regression test for a live security property.
      # It adds no network dependency: nothing in the offline suite makes a request.
      #
      # `store`, `chain`, `miner`, `benchmarks` are the v3 seams the suite drives offline: the S3
      # bucket class over a fake client, the chain adapter over generated storage items, the wallet
      # keyfile reader, and the benchmark adapters' fetch path — four tests fail outright without
      # `bittensor` and `huggingface_hub` installed (measured 2026-09-08), and the rest of those
      # seams' tests would skip, which is the same retirement by omission.
      - name: Install package + test deps
        run: uv pip install --system --no-cache -e ".[dev,tee,llm,store,chain,miner,benchmarks]"

      - name: Run test suite
        run: pytest -q
