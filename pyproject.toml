[project]
name = "thirtyspokes"
version = "0.0.1"
description = "Thirty Spokes — the v3 LLM-routing subnet (Bittensor netuid 99): conductor, validator, owner tools, serving"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Everything required by the unconditional offline test suite. Keep network-backed dataset clients
# in `eval`; the two MATH grader regressions still require math_verify in a clean test environment.
# `scikit-learn` is NOT optional here despite being a training dependency: `trainer.build_head` and
# `router_subnet`'s sim import it at module scope, so three unconditional tests fail collection
# without it — which is exactly how they failed in CI on every push for days. It pulls no network
# seam (unlike the dataset clients, which stay in `eval`), so it belongs with the offline suite.
# `httpx` is here for the same reason and by the same argument: `test_openrouter.py` guards it
# with a MODULE-SCOPE `importorskip`, so a clean `dev` environment does not fail — it silently drops
# all 30 tests of the client that decides what the subnet spends, which is the worst of both. Like
# scikit-learn it pulls no network seam (the tests drive it through `httpx.MockTransport`), so it
# belongs with the offline suite rather than in `llm`/`serve`, where it was reachable only by
# installing a live-model extra to test a client that never goes live in CI.
dev = ["pytest>=8.0", "math_verify>=0.5", "scikit-learn>=1.3", "httpx>=0.27"]
# The v3 validator's two real-world seams. Neither is needed by the offline suite — every test that
# wants one SKIPS without it — but both are imported by shipped code at runtime, and until now
# neither appeared in any extra, so `store.r2_bucket` and SWE-bench grading had no install path at
# all. `swebench` IS SWE-bench Verified's grader (§6.1.2 refuses reimplementing it); `pyarrow` reads
# the pinned parquet; `huggingface_hub` fetches it at its pinned commit.
store = ["boto3>=1.34"]
# Everything `orchestra-miner` imports beyond the core: the S3 client for the upload, the chain SDK
# (and its wallet) for `hotkey`/`identity`/`submit`, and the envelope cryptography `access` needs at
# import time — so the documented miner install (docs/MINER.md §1a step 0) runs.
miner = ["boto3>=1.34", "bittensor>=11.1,<12", "bittensor-wallet>=4.1,<5", "typer<0.27.2", "cryptography>=42.0"]
benchmarks = ["swebench>=4.1,<5", "pyarrow>=14", "huggingface_hub>=0.24"]
# Optional real-LLM outcome backends (offline runs work without these).
# `certifi` is declared explicitly rather than leaned on as an httpx transitive: the pool client's
# TLS regression test imports it DIRECTLY to build a hostile CA, and a transitive dependency that
# silently stops being pulled would turn that security test into a collection error.
llm = ["httpx>=0.27", "openai>=1.40", "certifi"]
# Live Bittensor chain integration (offline simulator works without it).
# PINNED TO 11.x: bittensor 11 dropped `Subtensor.substrate`, so `v3/chain.py` drives the 11 SDK's
# `query`/`query_map` over generated storage items and `submit_call` over generated call builders
# (ported and verified against testnet 526 on 2026-09-07). The offline suite cannot see an SDK break —
# every chain in it is a mock — which is why the major is pinned rather than left open.
# `typer<0.27.2`: bittensor 11.1's own `btcli` reads `Exit` from typer's vendored click module, and
# typer 0.27.2 (2026-08-28, after bittensor 11.1.0) dropped it — every btcli command then dies in
# its exit handler with AttributeError after doing its work. 0.27.1 and below expose it.
# Measured 2026-09-08 on 0.15.4 through 0.27.2.
chain = ["bittensor>=11.1,<12", "bittensor-wallet>=4.1,<5", "typer<0.27.2", "huggingface_hub>=0.24"]
# Metered-gateway linchpin: ed25519 receipt signing
gateway = ["cryptography>=42.0"]
# Real Intel-TDX attestation: pure-Python DCAP cert-chain (cryptography) + full DCAP
# quote verification incl. TCB status / CRL / QE-identity (dcap-qvl, Phala's Rust+PyO3 QVL)
tee = ["cryptography>=42.0", "dcap-qvl>=0.5"]
# Live evaluation: OpenRouter client + real task datasets (GSM8K, SWE-bench Pro),
# math_verify for robust MATH-500 grading, math_verify pulls sympy
# Beta routing API (`orchestra-serve`). The HTTP surface only — the routing decision itself is
# numpy + the pinned encoder, so the core package stays free of a web framework.
# scikit-learn is for `orchestra-serve-train` (the escalate-predictor trainer).
serve = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "openai>=1.40", "certifi",
         "scikit-learn>=1.3"]

[project.scripts]
# The commands are named for the subnet. `orchestra-*` was the mechanism's working name and it
# outlived the rename: the package installs as `thirtyspokes` and the product is Thirty Spokes, so a
# miner who followed the guide typed `pip install thirtyspokes` and then `orchestra-miner`, which
# reads like the wrong package at the one moment onboarding cannot afford a doubt.
thirtyspokes-enclave = "thirtyspokes.serve.enclave_cli:main"
thirtyspokes-serving-governance = "thirtyspokes.serve.governance:main"
thirtyspokes-dev = "thirtyspokes.v3.devkit:main"
thirtyspokes-sim = "thirtyspokes.v3.simulate:main"
thirtyspokes-validator = "thirtyspokes.v3.validator:main"
thirtyspokes-miner = "thirtyspokes.v3.miner:main"
thirtyspokes-owner = "thirtyspokes.v3.owner:main"
thirtyspokes-serve = "thirtyspokes.serve.cli:main"
thirtyspokes-serve-train = "thirtyspokes.serve.escalate:main"

# TRANSITIONAL ALIASES, and they are not decoration. A running validator is launched from a script
# on disk (`--state`'s launch.sh) and miners are reading guides that were published with the old
# names; dropping them in the same release as the rename turns a cosmetic change into an outage for
# anyone who does not redeploy first. Remove them once the deployment and the published guides have
# both moved — nothing in the tree refers to them after this commit.
orchestra-enclave = "thirtyspokes.serve.enclave_cli:main"
orchestra-serving-governance = "thirtyspokes.serve.governance:main"
orchestra-dev = "thirtyspokes.v3.devkit:main"
orchestra-sim = "thirtyspokes.v3.simulate:main"
orchestra-validator = "thirtyspokes.v3.validator:main"
orchestra-miner = "thirtyspokes.v3.miner:main"
orchestra-owner = "thirtyspokes.v3.owner:main"
orchestra-serve = "thirtyspokes.serve.cli:main"
orchestra-serve-train = "thirtyspokes.serve.escalate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thirtyspokes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
