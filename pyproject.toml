[project]
name = "thirtyspokes"
version = "0.0.1"
description = "ThirtySpokes — Phase 0 offline prototype for a TinyRouter-style LLM-routing Bittensor subnet"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Everything required by the unconditional offline test suite. Keep network-backed dataset clients
# in `eval`; the two MATH grader regressions still require math_verify in a clean test environment.
# `scikit-learn` is NOT optional here despite being a training dependency: `trainer.build_head` and
# `router_subnet`'s sim import it at module scope, so three unconditional tests fail collection
# without it — which is exactly how they failed in CI on every push for days. It pulls no network
# seam (unlike the dataset clients, which stay in `eval`), so it belongs with the offline suite.
dev = ["pytest>=8.0", "math_verify>=0.5", "scikit-learn>=1.3"]
# Optional real-LLM outcome backends (offline runs work without these).
# `certifi` is declared explicitly rather than leaned on as an httpx transitive: the pool client's
# TLS regression test imports it DIRECTLY to build a hostile CA, and a transitive dependency that
# silently stops being pulled would turn that security test into a collection error.
llm = ["httpx>=0.27", "openai>=1.40", "certifi"]
# Live Bittensor chain integration (offline simulator works without it).
# PINNED BELOW 11: `BittensorChain` drives `subtensor.substrate` directly for the storage reads the
# SDK does not wrap (CommitmentOf, the Keys uid->hotkey map, SubnetOwnerHotkey, SubnetOwnerCut), and
# bittensor 11 removed that attribute. With the old `>=8.0` the host resolved 10.5.0 — the version
# the chain seam was verified against — while a fresh Docker build resolved 11.0.1 and the validator
# crash-looped on startup with `'Subtensor' object has no attribute 'substrate'`. An unpinned major
# on the one dependency that talks to the chain is a silent time bomb; porting to 11.x is tracked
# separately.
chain = ["bittensor>=10.5,<11", "huggingface_hub>=0.24"]
# Metered-gateway linchpin: ed25519 receipt signing
gateway = ["cryptography>=42.0"]
# Real Intel-TDX attestation: pure-Python DCAP cert-chain (cryptography) + full DCAP
# quote verification incl. TCB status / CRL / QE-identity (dcap-qvl, Phala's Rust+PyO3 QVL)
tee = ["cryptography>=42.0", "dcap-qvl>=0.5"]
# Live evaluation: OpenRouter client + real task datasets (GSM8K, SWE-bench Pro),
# math_verify for robust MATH-500 grading, math_verify pulls sympy
eval = ["cryptography>=42.0", "openai>=1.40", "datasets>=2.14", "math_verify>=0.5", "dcap-qvl>=0.5"]

[project.scripts]
thirtyspokes = "thirtyspokes.cli:main"
orchestra-sim = "thirtyspokes.subnet.simulate:main"
orchestra2-sim = "thirtyspokes.gateway.subnet:main"
orchestra-tee-sim = "thirtyspokes.tee.subnet:main"
orchestra-koth-sim = "thirtyspokes.koth.subnet:main"
orchestra-koth-router-sim = "thirtyspokes.koth.router_subnet:main"
orchestra-koth-local = "thirtyspokes.koth.neuron:main"
orchestra-koth-miner = "thirtyspokes.koth.miner:main"
orchestra-koth-gcp-miner = "thirtyspokes.koth.gcp_operator:main"
orchestra-koth-validator = "thirtyspokes.koth.neuron:validator_main"
orchestra-koth-dev = "thirtyspokes.koth.devkit:main"
orchestra-koth-train = "thirtyspokes.koth.trainer:main"
orchestra-koth-owner = "thirtyspokes.koth.owner:main"
orchestra-koth-doctor = "thirtyspokes.koth.doctor:main"
orchestra-koth-reference = "thirtyspokes.koth.reference:main"
orchestra-miner = "thirtyspokes.subnet.miner:main"
orchestra-validator = "thirtyspokes.subnet.validator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thirtyspokes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
