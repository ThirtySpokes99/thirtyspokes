# ThirtySpokes KOTH validator. Quickstart:
#   cp .env.example .env          # set HF_TOKEN, NETUID, VALIDATOR_WALLET (no LLM key needed)
#   docker compose up -d --build
#
# The validator is verify-only (no GPU / no CVM). Its wallet hotkey signs set_weights, so your
# ~/.bittensor is mounted in; reign standings persist across restarts. It runs fail-closed on mainnet:
# a proof is scored only if its hardware quote matches the owner's pinned measured image.
# See docs/VALIDATOR.md.

services:
  validator:
    build:
      context: .
      args:
        # `docker compose build` picks this up from the environment; the Makefile/README flow sets it.
        # Unset simply means "unknown", which the preflight reports rather than pretending it matches.
        KOTH_BUILD_COMMIT: ${KOTH_BUILD_COMMIT:-unknown}
    image: thirtyspokes-validator:latest
    container_name: thirtyspokes-validator
    restart: unless-stopped
    # The daemon finishes any active atomic score/save/weight step after SIGTERM. Chain RPCs are
    # bounded to 20s, so this prevents an orchestrator SIGKILL in the middle of that recovery path.
    stop_grace_period: 30s
    environment:                            # explicit allow-list from .env; no ambient secrets
      # must match the bind-mount below at the SAME path on both sides (see volumes)
      KOTH_GRADE_DIR: /var/tmp/koth-grade
      # Lets the startup preflight read the CLI + cron slice defaults. The package inside the image
      # lives in site-packages, so without the checkout mounted below the agreement check can only
      # compare this process against itself — and it now says so instead of reporting a confident ok.
      KOTH_REPO_ROOT: /repo
      # OPTIONAL: a grounding-mode validator does ZERO inference and needs no LLM key.
      # Only the opt-in --audit-mode probe uses this (and bills you for miner inference).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Official publisher: owner token writes standings.json to the Thirty Spokes org.
      # Prefer a fine-grained token scoped to that repo/org.
      OWNER_HF_TOKEN: ${OWNER_HF_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}               # compatibility / gated datasets
      TAO_USD: ${TAO_USD:-}                 # optional; enables real $/hr dashboard columns
    volumes:
      - ${HOME}/.bittensor:/root/.bittensor        # wallet — holds the hotkey that signs set_weights
      - validator-state:/state                     # reign + king baseline survive restarts
      - .:/repo:ro                                 # read-only: preflight reads slice defaults only
      # THE CODE GRADER NEEDS THE HOST DOCKER DAEMON. `lcb.run_tests` runs each submitted program in
      # a throwaway `docker run --network none` container; without this socket it raises
      # GradingUnavailable and the RANKED benchmark cannot be scored at all.
      #
      # SECURITY: mounting the socket grants this container root-equivalent control of the host
      # daemon. That is a real privilege escalation and the reason it is called out here rather than
      # added quietly — run the validator on a host you are willing to give it. The alternative is a
      # remote/rootless daemon via DOCKER_HOST, which the grader honours since it just shells out.
      - /var/run/docker.sock:/var/run/docker.sock
      # SAME PATH ON BOTH SIDES, deliberately. The code grader bind-mounts its scratch dir into a
      # throwaway sandbox container, and the host daemon resolves that path in the HOST namespace —
      # so it has to be identical here and outside, or the mount silently binds nothing.
      - /var/tmp/koth-grade:/var/tmp/koth-grade
      # opt-in secret memorization probe (see --probe-bank below):
      # - ${PROBE_BANK_FILE:-/dev/null}:/secrets/probe_bank.json:ro
    command:
      - --netuid=${NETUID:?set NETUID in .env}
      - --wallet=${VALIDATOR_WALLET:?set VALIDATOR_WALLET in .env}
      - --hotkey=${VALIDATOR_HOTKEY:-default}
      - --network=${NETWORK:-finney}               # mainnet
      - --state=/state/koth_validator_state.json
      - --standings-repo=${STANDINGS_REPO:-}        # e.g. thirtyspokes/standings; blank disables
      # F2 grace: score an epoch ~10 min after it opens (50 blocks @ 12s). REQUIRED for the
      # router scalar: the owner's pool reference for epoch N is published a few minutes into
      # N, so scoring N the instant it opens finds no reference and silently falls back to the
      # absolute scalar -- forever. Must stay < epoch_blocks (100).
      # NO --grace-blocks HERE, DELIBERATELY. The validator adopts the grace point the OWNER
      # publishes on chain, so there is no second copy to drift out of sync. This line used to read
      # ${GRACE_BLOCKS:-50} while governance published 85, and every `compose up --force-recreate`
      # silently reverted a hand-set 85 back to 50 — scoring seven minutes early and disqualifying
      # proofs that met the published deadline. Add the flag back only to override deliberately.
      # --- optional (uncomment to enable) -----------------------------------------------------------
      # anti-grind (F7) + grace (F2) windows — opt-in; calibrate first (docs/VALIDATOR.md):
      # - --commit-window=${COMMIT_WINDOW:-8}
      # - --grace-blocks=${GRACE_BLOCKS:-40}
      # secret memorization probe bank (also mount PROBE_BANK_FILE above):
      # - --probe-bank=/secrets/probe_bank.json

volumes:
  validator-state:
